<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 CineVerse - Latest Movies</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ========================================== -->
    <!-- NAVIGATION BAR                            -->
    <!-- ========================================== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-film"></i>
                <span>Cine<span style="color: #e50914;">Verse</span></span>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="🔍 Search for a movie..." onkeyup="searchMovies()">
            </div>
            <div class="nav-links">
                <a href="#" class="active"><i class="fas fa-home"></i> Homepage</a>
                <a href="#"><i class="fas fa-fire"></i> Most Viewed</a>
                <a href="#"><i class="fas fa-star"></i> Reviews</a>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- MAIN CONTAINER                           -->
    <!-- ========================================== -->
    <div class="container">
        <!-- ========================================== -->
        <!-- SIDEBAR - Categories                      -->
        <!-- ========================================== -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3><i class="fas fa-tags"></i> Categories</h3>
                <ul class="category-list" id="categoryList">
                    <li class="category-item active" data-category="all" onclick="filterMovies('all')">
                        <i class="fas fa-th-large"></i> All
                    </li>
                    <li class="category-item" data-category="action" onclick="filterMovies('action')">
                        <i class="fas fa-gun"></i> Action
                    </li>
                    <li class="category-item" data-category="drama" onclick="filterMovies('drama')">
                        <i class="fas fa-mask"></i> Drama
                    </li>
                    <li class="category-item" data-category="crime" onclick="filterMovies('crime')">
                        <i class="fas fa-handcuffs"></i> Crime
                    </li>
                    <li class="category-item" data-category="adventure" onclick="filterMovies('adventure')">
                        <i class="fas fa-compass"></i> Adventure
                    </li>
                    <li class="category-item" data-category="thriller" onclick="filterMovies('thriller')">
                        <i class="fas fa-skull"></i> Thriller
                    </li>
                    <li class="category-item" data-category="series" onclick="filterMovies('series')">
                        <i class="fas fa-tv"></i> Series
                    </li>
                </ul>
            </div>
            
            <div class="sidebar-section">
                <h3><i class="fas fa-calendar"></i> New Releases</h3>
                <ul class="new-releases">
                    <li><i class="fas fa-circle" style="color: #e50914;"></i> Oppenheimer (2023)</li>
                    <li><i class="fas fa-circle" style="color: #e50914;"></i> The Godfather (1972)</li>
                    <li><i class="fas fa-circle" style="color: #ffd700;"></i> Scarface (1983)</li>
                </ul>
            </div>
        </aside>

        <!-- ========================================== -->
        <!-- MOVIES GRID                              -->
        <!-- ========================================== -->
        <main class="movies-grid" id="moviesGrid">
            <!-- Movies will be dynamically loaded here -->
        </main>
    </div>

    <!-- ========================================== -->
    <!-- FOOTER                                   -->
    <!-- ========================================== -->
    <footer class="footer">
        <p>© 2024 CineVerse - All rights reserved.</p>
    </footer>

    <!-- ========================================== -->
    <!-- JAVASCRIPT FILES                          -->
    <!-- ========================================== -->
    <script src="js/movies.js"></script>
    <script src="js/dropper.js"></script>
</body>
</html>
